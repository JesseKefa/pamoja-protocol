<svg width="400" height="400" viewBox="0 0 400 400"
xmlns="http://www.w3.org/2000/svg">

  <defs>

    <pattern
      id="woven"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M0 20 H40"
        stroke="#D9C9A5"
        stroke-width="0.6"
        opacity="0.25"/>

      <path
        d="M20 0 V40"
        stroke="#D9C9A5"
        stroke-width="0.6"
        opacity="0.25"/>

      <circle
        cx="20"
        cy="20"
        r="1.2"
        fill="#C79A3B"
        opacity="0.15"/>

    </pattern>

  </defs>

  <rect
    width="400"
    height="400"
    fill="url(#woven)"/>

</svg>